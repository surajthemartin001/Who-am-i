    <!-- GitHub Pages Single Page Application & Trailing Slash Fix -->
    <script>
      (function() {
        try {
          var l = window.location;
          // Ensure trailing slash on GitHub Pages root repo path (e.g. https://user.github.io/repo -> https://user.github.io/repo/)
          // This prevents relative asset paths from mistakenly resolving to the root domain and causing 404/blank page.
          if (l.hostname.endsWith('github.io')) {
            var parts = l.pathname.split('/').filter(Boolean);
            if (parts.length === 1 && !l.pathname.endsWith('/')) {
              l.replace(l.protocol + '//' + l.host + '/' + parts[0] + '/' + l.search + l.hash);
              return;
            }
          }
          // Decode SPA redirected path from 404.html if present
          if (l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&');
            }).join('?');
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
          }
        } catch (e) {
          console.warn('GitHub Pages router check bypassed:', e);
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-BW-jjjYd.js"></script>

  <body>
    <div id="root"></div>
    <script>
      // Automatic fallback for GitHub Pages when deployed directly from raw branch root:
      // If /src/main.tsx cannot run on static hosting and #root remains empty, forward to /docs/
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
        setTimeout(function() {
          var rootEl = document.getElementById('root');
          if (rootEl && (!rootEl.children || rootEl.children.length === 0)) {
            var pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length >= 1) {
              var repoName = pathParts[0];
              var targetUrl = window.location.protocol + '//' + window.location.host + '/' + repoName + '/docs/' + window.location.search + window.location.hash;
              window.location.replace(targetUrl);
            }
          }
        }, 1200);
      }
    </script>
