<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHO AM I? — Loading...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function() {
        try {
          var l = window.location;
          var isGitHubPages = l.hostname.indexOf('github.io') > -1;
          var repoSegments = isGitHubPages ? 1 : 0;

          // Save original URL to sessionStorage as fallback
          try {
            sessionStorage.setItem('redirect', l.href);
          } catch (e) {}

          var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + repoSegments).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(repoSegments).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' : '') +
            l.search.slice(1).replace(/&/g, '~and~') +
            l.hash;

          l.replace(target);
        } catch (err) {
          // Fallback if JavaScript redirection fails
          window.location.replace('./');
        }
      })();
    </script>
  </head>
  <body style="background:#07090e;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;padding:24px;">
      <div style="font-size:32px;margin-bottom:12px;">⚡</div>
      <h2 style="font-size:20px;font-weight:700;margin:0 0 8px;color:#f8fafc;">WHO AM I?</h2>
      <p style="color:#94a3b8;font-size:13px;margin:0;">Loading personal navigation system...</p>
    </div>
  </body>
</html>
